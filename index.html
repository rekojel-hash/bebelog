const nowISO  = () => new Date().toISOString();
const uid     = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();
const fmtT    = iso => iso ? new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";
const fmtD    = iso => iso ? new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}) : "";
const fmtDL   = iso => iso ? new Date(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"}) : "";
const fmtSec  = s => {
  if (!s || s <= 0) return "0s";
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return `${h}h${String(m).padStart(2,"0")}`;
  if (m > 0) return `${m}min ${String(sec).padStart(2,"0")}s`;
  return `${sec}s`;
};
const getAge = bd => {
  if (!bd) return null;
  const d = Math.floor((Date.now()-new Date(bd))/86400000);
  if (d < 0)  return null;
  if (d < 7)  return `${d} jour${d!==1?"s":""}`;
  const w = Math.floor(d/7);  if (w < 9)  return `${w} semaine${w!==1?"s":""}`;
  const mo = Math.floor(d/30.44); if (mo < 24) return `${mo} mois`;
  const y = Math.floor(mo/12), r = mo%12;
  return r > 0 ? `${y} an${y!==1?"s":""} et ${r} mois` : `${y} an${y!==1?"s":""}`;
};

// ─── Timer hook ───────────────────────────────────────────────────────────────
function useTimer() {
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const t0 = useRef(null);
  const iv = useRef(null);
  const start = useCallback(() => {
    t0.current = Date.now() - elapsed*1000;
    iv.current = setInterval(() => setElapsed(Math.floor((Date.now()-t0.current)/1000)), 500);
    setRunning(true);
  }, [elapsed]);
  const stop  = useCallback(() => { clearInterval(iv.current); setRunning(false); }, []);
  const reset = useCallback(() => { stop(); setElapsed(0); }, [stop]);
  useEffect(() => () => clearInterval(iv.current), []);
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  return { elapsed, running, start, stop, reset, fmt };
}

function TimerWidget({onSave, label}) {
  const {elapsed, running, start, stop, reset, fmt} = useTimer();
  return (
    <div style={{background:"#060b15",borderRadius:12,padding:"12px 14px",border:`1px solid ${C.bAcc}`,display:"flex",alignItems:"center",gap:12}}>
      <div style={{fontSize:24,fontWeight:800,color:C.acc,flex:1,fontVariantNumeric:"tabular-nums"}}>{fmt(elapsed)}</div>
      {label && <div style={{fontSize:12,color:C.mid}}>{label}</div>}
      {!running
        ? <Chip active onClick={start} style={{fontSize:12}}>▶ Start</Chip>
        : <>
            <Chip onClick={()=>{stop();if(elapsed>0&&onSave)onSave(elapsed);}} style={{background:"rgba(255,95,109,.15)",borderColor:C.red,color:C.red,fontSize:12}}>⏹ Stop</Chip>
            <Chip onClick={reset} style={{fontSize:12}}>↺</Chip>
          </>
      }
    </div>
  );
}

function BabySelector({babies, activeId, onSelect, onAdd, onDelete}) {
  const [adding,   setAdding]   = useState(false);
  const [name,     setName]     = useState("");
  const [birth,    setBirth]    = useState("");
  const [avatar,   setAvatar]   = useState("👶");

  const confirm = () => {
    if (!name.trim()) return;
    onAdd(newBaby(name.trim(), birth, avatar));
    setAdding(false); setName(""); setBirth(""); setAvatar("👶");
  };

  return (
    <div style={page}>
      <div style={secTit}>Choisir un enfant</div>
      {babies.map(b => (
        <div key={b.id} onClick={() => onSelect(b.id)}
          style={{...row, background:b.id===activeId?C.accS:C.surface, border:`1px solid ${b.id===activeId?C.acc:C.border}`, cursor:"pointer"}}>
          <span style={{fontSize:30}}>{b.avatar}</span>

            <div style={{fontSize:11,color:C.mid,marginTop:2}}>{b.birthDate ? getAge(b.birthDate) : "Date non renseignée"}</div>
          </div>
          {b.id===activeId && <span style={{color:C.acc,fontSize:18}}>✓</span>}
          {babies.length > 1 &&
            <button style={{background:"transparent",border:"none",cursor:"pointer",fontSize:16,color:C.dim}}
              onClick={e=>{e.stopPropagation();if(window.confirm(`Supprimer ${b.name} ?`))onDelete(b.id);}}>🗑</button>}
        </div>
      ))}
      {adding ? (
        <div style={card}>
          <div style={secTit}>Nouvel enfant</div>
          <div style={{marginTop:10}}>
            <Field label="Prénom"><Inp value={name} onChange={e=>setName(e.target.value)} placeholder="Prénom"/></Field>

// ─── FEED ─────────────────────────────────────────────────────────────────────
function FeedTab({data, setData}) {
  const [type,    setType]    = useState("Biberon");
  const [amount,  setAmount]  = useState("");
  const [side,    setSide]    = useState("Gauche");
  const [dur,     setDur]     = useState(null);
  const [note,    setNote]    = useState("");

  const add = () => {
    setData(d=>({...d,feeds:[...d.feeds,{id:uid(),time:nowISO(),type,amount,side:type==="Allaitement"?side:null,duration:dur,note}]}));
    setAmount(""); setDur(null); setNote("");
  };
  const del = id => setData(d=>({...d,feeds:d.feeds.filter(f=>f.id!==id)}));
  const todayFeeds = data.feeds.filter(f=>isToday(f.time));

  return (
    <div style={page}>
      <div style={card}>
        <Field label="Type de repas"><Chips options={["Biberon","Allaitement","Mixte","Solides","Eau"]} value={type} onChange={setType}/></Field>
        {(type==="Biberon"||type==="Mixte") && <Field label="Quantité (ml)"><Inp type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="120"/></Field>}
        {type==="Allaitement" && <>
          <Field label="Côté"><Chips options={["Gauche","Droit","Les deux"]} value={side} onChange={setSide}/></Field>
          <Field label="Durée"><TimerWidget onSave={setDur} label={dur?`✓ ${fmtSec(dur)}`:""}/></Field>
        </>}
        {type==="Solides" && <Field label="Aliment"><Inp value={note} onChange={e=>setNote(e.target.value)} placeholder="Compote pomme, purée carotte…"/></Field>}
        <Btn onClick={add}>✅ Enregistrer ce repas</Btn>
      </div>

      <div style={secTit}>Aujourd'hui · {todayFeeds.length} repas</div>
      {todayFeeds.length===0 && <Empty text="Aucun repas aujourd'hui"/>}
      {[...todayFeeds].reverse().map(f=>(
        <LogRow key={f.id}
          icon={f.type==="Biberon"?"🍼":f.type==="Allaitement"?"🤱":f.type==="Mixte"?"🔄":f.type==="Solides"?"🥣":"💧"}
          title={`${f.type}${f.amount?" · "+f.amount+"ml":""}`}
          sub={[fmtT(f.time),f.side,f.duration&&fmtSec(f.duration),f.note].filter(Boolean).join(" · ")}
          onDel={()=>del(f.id)}/>
      ))}

      <div style={secTit}>Historique</div>
      {data.feeds.length===0 && <Empty/>}
      {[...data.feeds].reverse().slice(0,20).map(f=>(
        <LogRow key={f.id+"h"}
          icon={f.type==="Biberon"?"🍼":f.type==="Allaitement"?"🤱":"🥣"}
          title={`${f.type}${f.amount?" · "+f.amount+"ml":""}`}
          sub={`${fmtD(f.time)} à ${fmtT(f.time)}${f.duration?" · "+fmtSec(f.duration):""}`}
          onDel={()=>del(f.id)}/>
      ))}
    </div>
  );
}

// ─── SLEEP ────────────────────────────────────────────────────────────────────
function SleepTab({data, setData}) {
  const active = data.sleeps.find(s=>!s.end);
  const [elapsed, setElapsed] = useState(0);

  useEffect(() => {
    if (!active) { setElapsed(0); return; }
    const iv = setInterval(() => setElapsed(Math.floor((Date.now()-new Date(active.start))/1000)), 1000);
    return () => clearInterval(iv);
  }, [active?.id]);

  const todaySleeps = data.sleeps.filter(s=>s.end&&isToday(s.start));
  const total = todaySleeps.reduce((a,s)=>a+(new Date(s.end)-new Date(s.start))/1000, 0);

  return (
    <div style={page}>
      <div style={{...cardHi,textAlign:"center",padding:"28px 16px"}}>
        {active ? (
          <>
            <div style={{fontSize:52}}>💤</div>
            <div style={{fontSize:44,fontWeight:800,color:C.purple,fontVariantNumeric:"tabular-nums",marginTop:6}}>{fmtSec(elapsed)}</div>
            <div style={{fontSize:13,color:C.mid,marginTop:6,marginBottom:16}}>En cours depuis {fmtT(active.start)}</div>
            <Btn style={{background:`linear-gradient(135deg,${C.red},#c94b4b)`}}
              onClick={()=>setData(d=>({...d,sleeps:d.sleeps.map(s=>s.id===active.id?{...s,end:nowISO()}:s)}))}>⏹ Terminer le sommeil</Btn>
          </>
        ) : (
          <>
            <div style={{fontSize:52}}>☀️</div>
            <div style={{fontSize:16,color:C.mid,marginBottom:16}}>Bébé est éveillé</div>
            <Btn style={{background:`linear-gradient(135deg,${C.green},#2ecc71)`}}
              onClick={()=>setData(d=>({...d,sleeps:[...d.sleeps,{id:uid(),start:nowISO(),end:null}]}))}>🌙 Démarrer le sommeil</Btn>
          </>
        )}
      </div>

      {todaySleeps.length>0 && (
        <div style={card}>
          <div style={{fontSize:12,color:C.mid,marginBottom:4}}>Sommeil total aujourd'hui</div>
          <div style={{fontSize:30,fontWeight:800,color:C.acc}}>{fmtSec(total)}</div>
        </div>
      )}

      <div style={secTit}>Historique</div>
      {data.sleeps.length===0 && <Empty text="Aucun sommeil enregistré"/>}
      {[...data.sleeps].reverse().slice(0,20).map(s=>(
        <LogRow key={s.id}
          icon={s.end?"🌙":"💤"}
          title={`${fmtD(s.start)} · ${fmtT(s.start)}`}
          sub={s.end ? `→ ${fmtT(s.end)} · ${fmtSec((new Date(s.end)-new Date(s.start))/1000)}` : "En cours…"}
          color={!s.end?C.purple:undefined}
          onDel={()=>setData(d=>({...d,sleeps:d.sleeps.filter(x=>x.id!==s.id)}))}/>
      ))}
    </div>
  );
}

function generateTx(child) {
  const today = new Date().toDateString();
  const log = child.dailyLogs.find(l=>new Date(l.date).toDateString()===today);
  if (!log || !log.events.length) return null;
  const evts = log.events;
  const lines = [];
  const dateFr = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long"});
  lines.push(`📋 Transmission du ${dateFr}`);
  lines.push(`👶 ${child.name}${child.birthDate?" ("+getAge(child.birthDate)+")":""}`);
  lines.push("");
  const feeds   = evts.filter(e=>e.type==="repas");
  const sleeps  = evts.filter(e=>e.type==="sieste");
  const diapers = evts.filter(e=>e.type==="couche");
  const acts    = evts.filter(e=>e.type==="activite");
  const notes   = evts.filter(e=>e.type==="note");
  const moods   = evts.filter(e=>e.type==="humeur");
  if(moods.length)  { lines.push(`😊 Humeur : ${moods[moods.length-1].value}`); }
  if(feeds.length)  { lines.push(`🍼 Repas (${feeds.length}) :`);   feeds.forEach(f=>lines.push(`   • ${fmtT(f.time)} — ${f.value}${f.amount?" ("+f.amount+"ml)":""}`)); }
  if(sleeps.length) { lines.push(`😴 Siestes (${sleeps.filter(s=>s.end).length}) :`); sleeps.filter(s=>s.end).forEach(s=>lines.push(`   • ${fmtT(s.time)} → ${fmtT(s.end)} (${fmtSec((new Date(s.end)-new Date(s.time))/1000)})`)); }
  if(diapers.length){ lines.push(`💩 Couches (${diapers.length}) :`); diapers.forEach(d=>lines.push(`   • ${fmtT(d.time)} — ${d.value}`)); }
  if(acts.length)   { lines.push(`🧸 Activités :`); acts.forEach(a=>lines.push(`   • ${a.value}${a.note?" — "+a.note:""}`)); }
  if(notes.length)  { lines.push(`📝 Notes :`); notes.forEach(n=>lines.push(`   • ${n.value}`)); }
  lines.push("");
  lines.push("Bonne soirée ! 👋");
  return lines.join("\n");
}

        const evtCount= log?.events?.length||0;
        return (
          <div key={c.id} onClick={()=>{setChildId(c.id);setView("child");}}

              <div style={{fontSize:11,marginTop:3,color:evtCount>0?C.green:C.dim}}>{evtCount>0?`✅ ${evtCount} événement${evtCount>1?"s":""} aujourd'hui`:"Aucun événement aujourd'hui"}</div>

            <span style={{fontSize:18,color:C.dim}}>›</span>

        <Chip onClick={()=>setView("list")} style={{fontSize:18,padding:"6px 10px"}}>←</Chip>

      </div>
      <div style={card}>
        <Field label="Prénom"><Inp value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Prénom de l'enfant"/></Field>
        <Field label="Date de naissance"><Inp type="date" value={newBirth} onChange={e=>setNewBirth(e.target.value)}/></Field>
        <Field label="Contact parents (tél. ou email)"><Inp value={newCtact} onChange={e=>setNewCtact(e.target.value)} placeholder="06 00 00 00 00"/></Field>
        <Field label="Avatar">
          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginTop:4}}>
            {CHILD_AVATARS.map(a=><Chip key={a} active={newAv===a} onClick={()=>setNewAv(a)} style={{fontSize:22,padding:"8px 10px"}}>{a}</Chip>)}

function NounouChild({child, update, onBack}) {
  const [sub,      setSub]      = useState("suivi");
  const [showForm, setShowForm] = useState(null);
  const [feedType, setFeedType] = useState("Biberon");
  const [feedAmt,  setFeedAmt]  = useState("");
  const [dType,    setDType]    = useState("Mixte");
  const [actType,  setActType]  = useState("Éveil");
  const [actNote,  setActNote]  = useState("");
  const [noteText, setNoteText] = useState("");
  const [txMsg,    setTxMsg]    = useState(null);

  const today   = new Date().toDateString();
  const todayLog= child.dailyLogs.find(l=>new Date(l.date).toDateString()===today) || {date:nowISO(),events:[]};
  const evts    = todayLog.events;

  const addEvt = evt => {
    update(c=>{
      const other   = c.dailyLogs.filter(l=>new Date(l.date).toDateString()!==today);
      const existing= c.dailyLogs.find(l=>new Date(l.date).toDateString()===today)||{date:nowISO(),events:[]};
      return {...c,dailyLogs:[...other,{...existing,events:[...existing.events,{id:uid(),...evt}]}]};
    });
  };
  const delEvt = eid => {
    update(c=>({...c,dailyLogs:c.dailyLogs.map(l=>
      new Date(l.date).toDateString()===today
        ?{...l,events:l.events.filter(e=>e.id!==eid)}
        :l
    )}));
  };

  // Sleep timer
  const activeSleep  = evts.find(e=>e.type==="sieste"&&!e.end);
  const [slpElapsed, setSlpElapsed] = useState(0);
  useEffect(()=>{
    if(!activeSleep){setSlpElapsed(0);return;}
    const iv=setInterval(()=>setSlpElapsed(Math.floor((Date.now()-new Date(activeSleep.time))/1000)),1000);
    return()=>clearInterval(iv);
  },[activeSleep?.id]);

  const stopSleep = () => update(c=>({...c,dailyLogs:c.dailyLogs.map(l=>
    new Date(l.date).toDateString()===today
      ?{...l,events:l.events.map(e=>e.id===activeSleep.id?{...e,end:nowISO()}:e)}
      :l
  )}));

  const txText   = generateTx(child);
  const feeds    = evts.filter(e=>e.type==="repas");
  const sleeps   = evts.filter(e=>e.type==="sieste");
  const diapers  = evts.filter(e=>e.type==="couche");
  const acts     = evts.filter(e=>e.type==="activite");

  const copyTx = () => {
    if (!txText) return;
    navigator.clipboard.writeText(txText).then(()=>{
      setTxMsg("📋 Copié dans le presse-papiers !");
      update(c=>({...c,transmissions:[...c.transmissions,{id:uid(),date:nowISO(),text:txText}]}));
      setTimeout(()=>setTxMsg(null),4000);
    });
  };
  const sendWA = () => {
    if (!txText) return;
    const num = (child.parentContact||"").replace(/\D/g,"");
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(txText)}`,"_blank");
    update(c=>({...c,transmissions:[...c.transmissions,{id:uid(),date:nowISO(),text:txText}]}));
  };
  const sendSMS = () => {
    if (!txText||!child.parentContact) return;
    window.open(`sms:${child.parentContact}?body=${encodeURIComponent(txText)}`,"_blank");
    update(c=>({...c,transmissions:[...c.transmissions,{id:uid(),date:nowISO(),text:txText}]}));
  };

  const EVTICON = {repas:"🍼",sieste:"😴",couche:"💩",activite:"🧸",humeur:"😊",note:"📝"};

  return (
    <div style={page}>
      {/* Back + header */}
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <Chip onClick={onBack} style={{fontSize:18,padding:"6px 10px"}}>←</Chip>
        <span style={{fontSize:36}}>{child.avatar}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:800}}>{child.name}</div>
          <div style={{fontSize:12,color:C.mid}}>{child.birthDate?getAge(child.birthDate):"Âge non renseigné"}</div>
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",gap:7}}>
        {[{k:"suivi",l:"📋 Suivi"},{k:"transmission",l:"📤 Transmission"},{k:"historique",l:"🗂 Historique"}].map(t=>(
          <Chip key={t.k} active={sub===t.k} onClick={()=>setSub(t.k)} style={{flex:1}}>{t.l}</Chip>
        ))}
      </div>

      {/* ── SUIVI ── */}
      {sub==="suivi" && <>
        {/* Actions rapides */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Btn style={{marginTop:0,fontSize:12}} onClick={()=>setShowForm(f=>f==="repas"?null:"repas")}>🍼 Repas ({feeds.length})</Btn>
          <Btn style={{marginTop:0,fontSize:12,background:`linear-gradient(135deg,${C.orange},#e87d1e)`}} onClick={()=>setShowForm(f=>f==="couche"?null:"couche")}>💩 Couche ({diapers.length})</Btn>
          <Btn style={{marginTop:0,fontSize:12,background:activeSleep?`linear-gradient(135deg,${C.red},#c94b4b)`:`linear-gradient(135deg,${C.purple},#7c6bf0)`}}
            onClick={()=>activeSleep?stopSleep():addEvt({type:"sieste",time:nowISO()})}>
            {activeSleep?`⏹ Fin sieste (${fmtSec(slpElapsed)})`:`😴 Sieste (${sleeps.filter(s=>s.end).length})`}
          </Btn>
          <Btn style={{marginTop:0,fontSize:12,background:`linear-gradient(135deg,${C.pink},#e060a0)`}} onClick={()=>setShowForm(f=>f==="activite"?null:"activite")}>🧸 Activité ({acts.length})</Btn>
        </div>

        {/* Humeur */}
        <div style={card}>
          <div style={lbl}>😊 Humeur du moment</div>
          <Chips options={["😴 Fatigué","😊 Bien","😄 Super","😢 Pleurs","😠 Agité"]}
            value={evts.filter(e=>e.type==="humeur").slice(-1)[0]?.value||""}
            onChange={v=>addEvt({type:"humeur",time:nowISO(),value:v})}/>
        </div>

        {/* Mini-forms */}
        {showForm==="repas" && (
          <div style={card}>
            <Field label="Type"><Chips options={["Biberon","Mixte","Solides","Allaitement","Eau"]} value={feedType} onChange={setFeedType}/></Field>
            {(feedType==="Biberon"||feedType==="Mixte") && <Field label="Quantité (ml)"><Inp type="number" value={feedAmt} onChange={e=>setFeedAmt(e.target.value)} placeholder="120"/></Field>}
            <Btn onClick={()=>{addEvt({type:"repas",time:nowISO(),value:feedType,amount:feedAmt});setFeedAmt("");setShowForm(null);}}>✅ Enregistrer</Btn>
          </div>
        )}
        {showForm==="couche" && (
          <div style={card}>
            <Field label="Type"><Chips options={["Urine","Selles","Mixte","Sèche"]} value={dType} onChange={setDType}/></Field>
            <Btn onClick={()=>{addEvt({type:"couche",time:nowISO(),value:dType});setShowForm(null);}}>✅ Enregistrer</Btn>
          </div>
        )}
        {showForm==="activite" && (
          <div style={card}>
            <Field label="Activité"><Chips options={["Éveil","Lecture","Musique","Promenade","Jeux","Bain","Dessin"]} value={actType} onChange={setActType}/></Field>
            <Field label="Note"><Inp value={actNote} onChange={e=>setActNote(e.target.value)} placeholder="Observation…"/></Field>
            <Btn onClick={()=>{addEvt({type:"activite",time:nowISO(),value:actType,note:actNote});setActNote("");setShowForm(null);}}>✅ Enregistrer</Btn>
          </div>
        )}

        {/* Note libre */}
        <div style={card}>
          <Field label="📝 Note rapide">
            <div style={{display:"flex",gap:8}}>
              <Inp style={{flex:1}} value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Observation…"/>
              <Btn style={{marginTop:0,width:"auto",padding:"11px 16px"}} onClick={()=>{if(!noteText.trim())return;addEvt({type:"note",time:nowISO(),value:noteText});setNoteText("");}}>+</Btn>
            </div>
          </Field>
        </div>

        {/* Timeline */}
        <div style={secTit}>Timeline du jour ({evts.length})</div>
        {evts.length===0 && <Empty text="Aucun événement aujourd'hui"/>}
        {[...evts].reverse().map(e=>(
          <LogRow key={e.id}
            icon={EVTICON[e.type]||"📌"}
            title={e.type==="sieste"&&e.end ? `Sieste · ${fmtSec((new Date(e.end)-new Date(e.time))/1000)}` : e.type==="sieste" ? "Sieste en cours…" : e.type==="repas" ? `${e.value}${e.amount?" · "+e.amount+"ml":""}` : e.value}
            sub={`${fmtT(e.time)}${e.note?" · "+e.note:""}`}
            color={e.type==="sieste"&&!e.end?C.purple:undefined}
            onDel={()=>delEvt(e.id)}/>
        ))}
      </>}

      {/* ── TRANSMISSION ── */}
      {sub==="transmission" && <>
        <div style={cardHi}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:6}}>📤 Rapport journalier</div>
          <div style={{fontSize:12,color:C.mid,marginBottom:12}}>Généré automatiquement depuis le suivi du jour</div>
          {txText ? (
            <pre style={{background:"#060b15",borderRadius:12,padding:"14px",fontSize:11,color:C.txt,whiteSpace:"pre-wrap",border:`1px solid ${C.bAcc}`,fontFamily:"'Nunito',sans-serif",lineHeight:1.7,margin:0,overflowX:"auto"}}>{txText}</pre>
          ) : (
            <Empty text="Aucun événement à transmettre aujourd'hui"/>
          )}
        </div>

        {txMsg && <Alert text={txMsg} ok/>}

        {txText && <>
          <Btn style={{background:"linear-gradient(135deg,#25d366,#128c7e)"}} onClick={sendWA}>💬 Envoyer via WhatsApp</Btn>
          {child.parentContact && child.parentContact.match(/\d/) &&
            <Btn style={{background:`linear-gradient(135deg,${C.acc},#3b82f6)`}} onClick={sendSMS}>📱 Envoyer par SMS</Btn>}

        {!child.parentContact && (
          <div style={{...card,background:"rgba(91,141,238,.08)",border:`1px solid rgba(91,141,238,.3)`}}>
            <div style={{fontSize:12,color:C.acc}}>💡 Ajoutez le contact des parents dans le profil pour envoyer directement par SMS.</div>

        {child.transmissions.length>0 && <>
          <div style={secTit}>Transmissions envoyées ({child.transmissions.length})</div>

            <div key={t.id} style={card}>

        {[...child.dailyLogs].reverse().map(log=>(
          <div key={log.date} style={card}>
            <div style={{fontSize:13,fontWeight:700,color:C.acc,marginBottom:10}}>📅 {fmtDL(log.date)}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[["🍼",log.events.filter(e=>e.type==="repas").length,"repas"],
                ["😴",log.events.filter(e=>e.type==="sieste"&&e.end).length,"siestes"],
                ["💩",log.events.filter(e=>e.type==="couche").length,"couches"],
                ["🧸",log.events.filter(e=>e.type==="activite").length,"activités"]].map(([ic,n,l])=>(
                <div key={l} style={{background:"#060b15",borderRadius:10,padding:"8px 12px",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>{ic}</span>
                  <span style={{fontSize:13,fontWeight:700,color:C.txt}}>{n}</span>
                  <span style={{fontSize:11,color:C.dim}}>{l}</span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </>}
    </div>
  );
}

// ─── SAVE / LOAD ──────────────────────────────────────────────────────────────
function SaveTab({babies, setBabies, activeId}) {
  const [msg,    setMsg]    = useState(null);
  const fileRef             = useRef();
  const baby                = babies.find(b=>b.id===activeId);

  const showMsg = (text,ok) => { setMsg({text,ok}); setTimeout(()=>setMsg(null),3500); };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({v:2,babies},null,2)],{type:"application/json"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `bebelog_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showMsg("✅ Sauvegarde téléchargée !",true);
  };

  const importData = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const p = JSON.parse(ev.target.result);
        const bs = p.babies||p; // compatibilité v1
        if (Array.isArray(bs)) { setBabies(bs); showMsg(`✅ ${bs.length} enfant(s) chargé(s) !`,true); }
        else showMsg("❌ Format de fichier invalide.",false);
      } catch { showMsg("❌ Fichier illisible.",false); }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const stats = baby ? [
    ["🍼 Repas",      baby.feeds.length],
    ["😴 Sommeils",   baby.sleeps.length],
    ["💩 Couches",    baby.diapers.length],
    ["⚖️ Pesées",     baby.weights.length],
    ["🌡️ Températures",baby.temps.length],
    ["💊 Médicaments",(baby.medicines||[]).length],
    ["💉 Vaccins",    (baby.vaccines||[]).length],
    ["⭐ Étapes",     (baby.milestones||[]).length],
    ["🧸 Activités",  (baby.activities||[]).length],
    ["📝 Notes",      baby.notes.length],
  ] : [];

  return (
    <div style={page}>
      {baby && <>
        <div style={secTit}>Données de {baby.name}</div>
        <div style={{...card,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {stats.map(([l,v])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{color:C.mid}}>{l}</span>
              <span style={{fontWeight:700,color:C.acc}}>{v}</span>
            </div>
          ))}
        </div>
      </>}
      {msg && <Alert text={msg.text} ok={msg.ok}/>}
      <div style={secTit}>Sauvegarder</div>
      <div style={card}>
        <p style={{fontSize:13,color:C.mid,margin:"0 0 10px"}}>Exporte tous les profils dans un fichier JSON. Conservez-le sur Google Drive, iCloud…</p>
        <Btn onClick={exportData}>📥 Télécharger (.json)</Btn>
      </div>
      <div style={secTit}>Importer</div>
      <div style={card}>
        <p style={{fontSize:13,color:C.mid,margin:"0 0 10px"}}>Restaure depuis une sauvegarde. ⚠️ Remplace les données actuelles.</p>
        <input type="file" accept=".json" ref={fileRef} style={{display:"none"}} onChange={importData}/>
        <Btn style={{background:`linear-gradient(135deg,${C.orange},#e87d1e)`}} onClick={()=>fileRef.current.click()}>📂 Charger un fichier (.json)</Btn>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
const TABS = [
  {label:"🏠", full:"Accueil"},
  {label:"🍼", full:"Repas"},
  {label:"🌙", full:"Sommeil"},
  {label:"❤️", full:"Santé"},
  {label:"🌱", full:"Éveil"},
  {label:"✅", full:"Routine"},
  {label:"👩‍👧", full:"Nounou"},
  {label:"💾", full:"Données"},
  {label:"💛", full:"Soutien"},
];

function App() {
  const [babies,   setBabies]   = useState(() => [newBaby("Bébé 1","","👶")]);
  const [activeId, setActiveId] = useState(() => babies[0]?.id ?? null);
  const [tab,      setTab]      = useState(0);
  const [picker,   setPicker]   = useState(false);
  const [nounouKids, setNounouKids] = useState([]);

  // Keep activeId valid
  useEffect(()=>{
    if (!babies.find(b=>b.id===activeId)) setActiveId(babies[0]?.id??null);
  },[babies, activeId]);

  const activeBaby = babies.find(b=>b.id===activeId) ?? babies[0];
  const setBabyData = useCallback(upd =>
    setBabies(bs=>bs.map(b=>b.id===activeId?(typeof upd==="function"?upd(b):upd):b)),
  [activeId]);

  const selectBaby = id  => { setActiveId(id); setPicker(false); };
  const addBaby    = b   => { setBabies(bs=>[...bs,b]); setActiveId(b.id); setPicker(false); };
  const delBaby    = id  => {
    const rest = babies.filter(b=>b.id!==id);
    setBabies(rest);
    if (activeId===id) setActiveId(rest[0]?.id??null);
    setPicker(false);
  };

  const content = () => {
    if (picker) return <BabySelector babies={babies} activeId={activeId} onSelect={selectBaby} onAdd={addBaby} onDelete={delBaby}/>;
    switch(tab) {
      case 0: return <HomeTab      data={activeBaby} setData={setBabyData}/>;
      case 1: return <FeedTab      data={activeBaby} setData={setBabyData}/>;
      case 2: return <SleepTab     data={activeBaby} setData={setBabyData}/>;
      case 3: return <HealthTab    data={activeBaby} setData={setBabyData}/>;
      case 4: return <DevTab       data={activeBaby} setData={setBabyData}/>;
      case 5: return <ChecklistTab data={activeBaby} setData={setBabyData}/>;
      case 6: return <NounouTab    children={nounouKids} setChildren={setNounouKids}/>;
      case 7: return <SaveTab      babies={babies} setBabies={setBabies} activeId={activeId}/>;
      case 8: return <SupportTab/>;
      default: return null;
    }
  };

  return (
    <div style={{fontFamily:"'Nunito',sans-serif",background:C.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",color:C.txt}}>
      <style>{GLOBAL_CSS}</style>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

      {/* ── Header ── */}
      <div style={{background:`linear-gradient(160deg,#0f1830 0%,${C.bg} 100%)`,padding:"14px 16px 0",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <span style={{fontSize:28}}>👶</span>
          <div style={{flex:1}}>
            <div style={{fontSize:18,fontWeight:800,letterSpacing:"-.5px"}}>BébéLog</div>
            <div style={{fontSize:11,color:C.mid}}>Votre compagnon parental</div>
          </div>
          {/* Baby switcher — hidden on Nounou tab */}
          {tab!==6 ? (
            <button onClick={()=>setPicker(p=>!p)}
              style={{display:"flex",alignItems:"center",gap:7,background:picker?C.accS:"rgba(255,255,255,.05)",border:`1px solid ${picker?C.acc:C.bAcc}`,borderRadius:20,padding:"6px 12px",cursor:"pointer",color:picker?C.acc:C.txt,fontSize:12,fontWeight:700}}>
              <span style={{fontSize:18}}>{activeBaby?.avatar||"👶"}</span>
              <span style={{maxWidth:70,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{activeBaby?.name}</span>
              {babies.length>1 && <span style={{fontSize:10,color:C.mid}}>+{babies.length-1}</span>}
              <span style={{fontSize:10,color:C.mid}}>{picker?"▲":"▼"}</span>
            </button>
          ) : (
            <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(45,212,191,.1)",border:"1px solid rgba(45,212,191,.3)",borderRadius:20,padding:"6px 12px"}}>
              <span style={{fontSize:16}}>👩‍👧</span>
              <span style={{fontSize:12,fontWeight:700,color:C.teal}}>Nounou</span>
            </div>
          )}
        </div>
        {/* Nav */}
        <div style={{display:"flex",overflowX:"auto"}}>
          {TABS.map((t,i)=>(
            <button key={i} onClick={()=>{setPicker(false);setTab(i);}}
              style={{flexShrink:0,padding:"10px 11px",border:"none",background:"transparent",
                color:!picker&&tab===i?(i===6?C.teal:C.acc):C.dim,
                fontSize:10,fontWeight:700,cursor:"pointer",
                borderBottom:`3px solid ${!picker&&tab===i?(i===6?C.teal:C.acc):"transparent"}`,
                whiteSpace:"nowrap"}}>
              {t.label} {t.full}
            </button>
          ))}
        </div>
      </div>

      {/* ── Content ── */}
      <div style={{flex:1,overflowY:"auto"}}>
        {content()}
      </div>
    </div>
  );
}


    // ── Patch App to add localStorage persistence ─────────────────────────────
    function AppWithPersistence() {
      const [babies,     setBabies]     = useState(() => lsGet(LS_KEY,    null) || [newBaby("Bébé 1","","👶")]);
      const [nounouKids, setNounouKids] = useState(() => lsGet(LS_NOUNOU, []));

      // Auto-save on every change
      useEffect(() => { lsSet(LS_KEY, babies); },     [babies]);
      useEffect(() => { lsSet(LS_NOUNOU, nounouKids); }, [nounouKids]);

      return React.createElement(App, {
        __babies:     babies,
        __setBabies:  setBabies,
        __nounou:     nounouKids,
        __setNounou:  setNounouKids,
      });
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App, null));
    document.getElementById("loader").style.display = "none";
  </script>

  <!-- ── Service Worker Registration ────────────────────────────────────────── -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => {
            console.log("[BébéLog] SW enregistré :", reg.scope);
            // Écoute les mises à jour
            reg.addEventListener("updatefound", () => {
              const w = reg.installing;
              w.addEventListener("statechange", () => {
                if (w.state === "installed" && navigator.serviceWorker.controller) {
                  // Nouvelle version dispo — notifier l'utilisateur
                  if (confirm("🔄 Mise à jour disponible ! Recharger BébéLog ?")) {
                    w.postMessage("SKIP_WAITING");
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => console.warn("[BébéLog] SW échec :", err));
      });
    }

    // ── Bannière d'installation PWA (Android/Chrome) ──────────────────────────
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
      // Afficher une bannière custom après 3 secondes
      setTimeout(() => {
        if (!deferredPrompt) return;
        if (localStorage.getItem("pwa_installed")) return;
        const banner = document.createElement("div");
        banner.id = "pwa-banner";
        banner.innerHTML = `
          <div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            background:#1a2340;border:1px solid #2a3f6a;border-radius:16px;
            padding:14px 18px;display:flex;align-items:center;gap:12px;
            max-width:380px;width:calc(100% - 32px);z-index:9998;
            box-shadow:0 8px 32px rgba(0,0,0,.5);font-family:'Nunito',sans-serif">
            <span style="font-size:32px">📲</span>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:700;color:#dce6f8">Installer BébéLog</div>
              <div style="font-size:11px;color:#8ca0c0;margin-top:2px">Accès rapide depuis l'écran d'accueil</div>
            </div>
            <button id="pwa-install" style="background:linear-gradient(135deg,#5b8dee,#7c6bf0);
              border:none;border-radius:10px;padding:8px 14px;color:#fff;
              font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif">
              Installer
            </button>
            <button id="pwa-dismiss" style="background:transparent;border:none;
              color:#4a5a78;font-size:18px;cursor:pointer;padding:4px">✕</button>
          </div>
        `;
        document.body.appendChild(banner);
        document.getElementById("pwa-install").onclick = () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {
            deferredPrompt = null;
            localStorage.setItem("pwa_installed","1");
            banner.remove();
          });
        };
        document.getElementById("pwa-dismiss").onclick = () => {
          banner.remove();
          localStorage.setItem("pwa_installed","1");
        };
      }, 3000);
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      localStorage.setItem("pwa_installed","1");
      const b = document.getElementById("pwa-banner");
      if (b) b.remove();
    });
  </script>
